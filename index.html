<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="game">

        <img class="logo" src="logonew.png" alt="Tetris">

        <div class="game-layout">

            <div class="legend">
                <img src="legend.png" alt="Movement Legend">
            </div>

            <div class="board"></div>

            <div class="sidebar">

                <div class="panel4">
                    <h2>NEXT</h2>
                    <div class="next-piece"></div>
                </div>

                <div class="panel">
                    <h2>SCORE</h2>
                    <p id="score">0</p>
                </div>

                <div class="panel">
                    <h2>LEVEL</h2>
                    <p id="level">1</p>
                </div>

                <div class="panel">
                    <h2>PAUSE</h2>
                    <button id="pauseButton">PAUSE</button>
                </div>
                
            </div>

        </div>

    </main>

    <div id="gameOver" class="game-over">
        <h2>GAME OVER</h2>
        <button id="restartButton">RESTART</button>
    </div>

    <div id="winScreen" class="game-over win-screen">
        <h2>CONGRATULATIONS!</h2>
        <p>YOU WIN!</p>
        <button id="winRestartButton">RESTART</button>
    </div>

    <script src="script.js"></script>

</body>

</html>
